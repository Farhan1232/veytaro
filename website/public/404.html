<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seite nicht gefunden — Veytaro</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      A last-resort page.

      On Cloudflare Pages `_redirects` rewrites unknown paths to index.html, so
      the app's own 404 view normally handles them and this file is never
      reached. It stays for any host that serves 404.html directly.

      Everything is inline and self-contained: it has to render correctly with
      no bundle, no stylesheet and no webfont. It honours the stored theme the
      same way index.html does, so a visitor who chose light does not get a dark
      page here.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("veytaro-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f5f7fa" : "#07111f");
        } catch (e) {
          /* Storage blocked — the dark default stands. */
        }
      })();
    </script>
    <style>
      :root {
        --bg: #07111f;
        --surface: #111f31;
        --border: rgba(255, 255, 255, 0.12);
        --text: #f8fafc;
        --muted: #a8b3c5;
        --brand: #7ea0ff;
        --brand-solid: #3a66e0;
        --brand-solid-hover: #3560db;
      }

      [data-theme="light"] {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --border: #dfe5ee;
        --text: #101828;
        --muted: #475467;
        --brand: #2f5fe0;
        --brand-solid: #2f5fe0;
        --brand-solid-hover: #2750c4;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        padding: 32px 24px;
        text-align: center;
        font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
        color: var(--text);
        background:
          radial-gradient(
            900px 460px at 50% -10%,
            rgba(76, 125, 255, 0.16),
            transparent 62%
          ),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      img {
        width: 84px;
        height: auto;
        display: block;
      }

      .code {
        margin: 0;
        padding: 5px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: var(--brand);
      }

      h1 {
        margin: 0;
        font-family: "Sora", "Outfit", system-ui, sans-serif;
        font-size: clamp(26px, 5vw, 34px);
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      p.text {
        margin: 0;
        max-width: 46ch;
        color: var(--muted);
      }

      a {
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 26px;
        border-radius: 10px;
        background: var(--brand-solid);
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
        transition: background 140ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      a:hover {
        background: var(--brand-solid-hover);
      }

      a:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <img src="/veytaro-mark-128.png" alt="Veytaro" width="128" height="89" />
    <p class="code">Fehler 404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p class="text">Die aufgerufene Adresse existiert nicht oder wurde verschoben.</p>
    <a href="/">Zur Startseite</a>
  </body>
</html>
